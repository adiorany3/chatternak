# Contoh konfigurasi umum OpenAI-compatible Chat Completions API.
# API key disimpan di Streamlit Secrets, bukan di config.toml.

[openai]
enabled = true
chat_completions_url = "https://api.slashai.my.id/v1/chat/completions"
model = "slashai/gpt-5-mini"
temperature = 0.7
max_tokens = 1000
timeout = 60
