# Konfigurasi umum OpenAI-compatible Chat Completions API.
# API key JANGAN disimpan di file ini untuk deployment publik.
# Untuk Streamlit Online, simpan API key di App settings → Secrets.

[openai]
enabled = true
chat_completions_url = "https://api.slashai.my.id/v1/chat/completions"

# Model awal dibuat paling murah/ringan.
# Setiap request akan mulai dari model ini lagi.
model = "slashai/gpt-5-nano"

# Jika model awal gagal, kosong, terlalu pendek, atau tidak menjawab,
# aplikasi akan naik ke model berikutnya secara berurutan.
fallback_models = [
  "slashai/gpt-5-mini",
  "slashai/claude-haiku-4.5",
  "slashai/gemini-3-flash",
  "slashai/deepseek-v3.2"
]
smart_fallback_enabled = true

temperature = 0.7
max_tokens = 1600
# Khusus tombol Tes koneksi API. Jangan terlalu kecil untuk model reasoning.
test_max_tokens = 200
timeout = 60
min_answer_chars = 30
