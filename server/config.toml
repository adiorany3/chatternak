# Konfigurasi umum OpenAI-compatible Chat Completions API.
# API key JANGAN disimpan di file ini untuk deployment publik.
# Untuk Streamlit Online, simpan API key di App settings → Secrets.

[openai]
enabled = true
chat_completions_url = "https://api.slashai.my.id/v1/chat/completions"
model = "slashai/gpt-5-mini"
temperature = 0.7
max_tokens = 1000
timeout = 60
